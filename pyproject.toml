[project]
name = "img-iter-agent"
version = "0.0.1"
description = "Self-iterating AI image agent: generates new content while preserving a stable style via an adversarial summarization loop."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zenthos-z" }]

dependencies = [
    # 基础层 (Step 1, 无网络可测)
    "pydantic>=2",
    "pydantic-settings>=2",
    # 生图适配层 (Step 3)
    "httpx",
    "tenacity",
    # 后续步骤填入: langchain-openai(Critic/agent LLM, Step 2生产端) / pillow
    #              langgraph(编排, Step 4) / scikit-learn+pandas+matplotlib(校准/分析, Step 5)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img_iter_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
