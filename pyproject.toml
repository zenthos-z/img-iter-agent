[project]
name = "img-iter-agent"
version = "0.0.1"
description = "Self-iterating AI image agent: generates new content while preserving a stable style via an adversarial summarization loop."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zenthos-z" }]

dependencies = [
    # 基础层 (Step 1, 无网络可测)
    "pydantic>=2",
    "pydantic-settings>=2",
    # 生图适配层 (Step 3)
    "httpx",
    "tenacity",
    # agent 编排 (Step 4)
    "langgraph",
    "langgraph-checkpoint-sqlite",
    # LLM 调用 + LangSmith 追踪：dmxapi 暴露 OpenAI 兼容端点，用官方 openai SDK 调用，
    # langsmith.wrap_openai 自动把每次 chat 调用上报为带模型名/usage/耗时的 run_type="llm" run。
    # langsmith 虽是 langgraph 的传递依赖，但我们直接 import 它，故显式声明。
    "openai",
    "langsmith",
    # 校准/分析 (Step 5, 离线)
    "scipy",
    "pandas",
    "matplotlib",
    # 可视化打分台 (Step 6, 前后端解耦)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
img-iter-web = "img_iter_agent.web.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img_iter_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
